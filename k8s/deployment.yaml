apiVersion: apps/v1
kind: Deployment
metadata: { name: cicd-app }
spec:
  replicas: 2
  selector: { matchLabels: { app: cicd-app } }
  template:
    metadata: { labels: { app: cicd-app } }
    spec:
      containers:
      - name: app
        image: IMAGE_PLACEHOLDER
        ports: [{ containerPort: 5000 }]
        readinessProbe: { httpGet: { path: /health, port: 5000 } }
